<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Image to Text</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 720px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        h1 {
            margin-bottom: .25rem;
        }

        #drop {
            border: 2px dashed #888;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
        }

        img#preview {
            max-width: 100%;
            max-height: 300px;
            margin-top: 1rem;
            display: none;
        }

        button {
            padding: .6rem 1.2rem;
            margin: .5rem .5rem 0 0;
            border-radius: 8px;
            border: 0;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

            button:disabled {
                opacity: .5;
                cursor: not-allowed;
            }

        textarea {
            width: 100%;
            height: 260px;
            margin-top: 1rem;
            padding: .75rem;
            box-sizing: border-box;
        }

        #status {
            margin-top: .75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Image to Text</h1>
    <p>Upload a photo or screenshot. Slightly blurry images are fine.</p>

    <div id="drop">Click to choose an image</div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" alt="preview">

    <div>
        <button id="go" disabled>Extract text</button>
        <button id="copy" disabled>Copy text</button>
    </div>
    <div id="status"></div>
    <textarea id="out" placeholder="Extracted text will appear here" readonly></textarea>

    <script>
const fileInput = document.getElementById("file");
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const go = document.getElementById("go");
const copy = document.getElementById("copy");
const out = document.getElementById("out");
const status = document.getElementById("status");
let chosen = null;

drop.onclick = () => fileInput.click();
fileInput.onchange = () => {
  chosen = fileInput.files[0];
  if (!chosen) return;
  preview.src = URL.createObjectURL(chosen);
  preview.style.display = "block";
  go.disabled = false;
};

// Shrink big photos in the browser so the upload stays small
function shrink(file, maxSide = 2200) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => resolve(b), "image/jpeg", 0.9);
    };
    img.src = URL.createObjectURL(file);
  });
}

go.onclick = async () => {
  go.disabled = true;
  status.textContent = "Reading image…";
  out.value = "";
  try {
    const blob = await shrink(chosen);
    const form = new FormData();
    form.append("image", blob, "upload.jpg");
    const res = await fetch("/api/ocr", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong");
    out.value = data.text;
    copy.disabled = false;
    status.textContent = "Done.";
  } catch (e) {
    status.textContent = "Error: " + e.message;
  } finally {
    go.disabled = false;
  }
};

copy.onclick = async () => {
  await navigator.clipboard.writeText(out.value);
  status.textContent = "Copied!";
};
    </script>
</body>
</html>
